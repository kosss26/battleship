name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bs
          POSTGRES_PASSWORD: bs
          POSTGRES_DB: battleship_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bs:bs@localhost:5432/battleship_test
      E2E_DATABASE_URL: postgres://bs:bs@localhost:5432/battleship_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create the e2e database
        run: PGPASSWORD=bs psql -h localhost -U bs -d battleship_test -c 'CREATE DATABASE battleship_e2e'

      - name: Backend tests (unit + socket integration)
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
